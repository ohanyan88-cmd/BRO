name: Canonical contract gates

on:
  push:
    branches: [main]
  pull_request:
    # The wave gate judges the PR body, so it must run again when the body changes --
    # otherwise a passing verdict can outlive the declaration it was passing on.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject direct main delivery
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_main_delivery.py
      - name: Enforce remediation wave policy
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_remediation_wave.py
      - run: make check
